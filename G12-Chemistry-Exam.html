<style>
/* Same look as the G12 Physics exam app: ruled notebook paper with a red margin line, ink-navy header with amber stripes, Space Mono labels, Lora body, red/ink buttons. Single light theme by design. */
:root{
  --paper:#EEF1EA; --paper-line:#cdd6c9; --ink:#14232F; --ink-soft:#4A5A63;
  --red:#A82F26; --red-deep:#7E211A; --green:#256B48; --amber:#D9A441; --card:#FBFBF8;
  --shadow-sm:0 1px 2px rgba(20,35,47,.06); --shadow-md:0 6px 16px rgba(20,35,47,.10); --shadow-lg:0 14px 32px rgba(20,35,47,.16);
  --serif:'Lora','Iowan Old Style',Georgia,serif; --mono:'Space Mono','SFMono-Regular',Consolas,monospace;
  --bg:var(--paper); --muted:var(--ink-soft); --line:rgba(24,43,58,.14); --navy:var(--ink);
  --blue1:var(--red); --blue2:var(--red-deep); --red1:var(--red); --red2:var(--red-deep);
  --ok:#256B48; --ok-bg:rgba(45,138,86,.12); --no:#A82F26; --no-bg:rgba(168,47,38,.10);
  --soft:rgba(24,43,58,.06); --ans-bg:rgba(45,138,86,.09); --ans-bar:#2D8A56;
  --f-sans:var(--mono);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink);min-height:100vh;
  background:repeating-linear-gradient(var(--paper) 0px,var(--paper) 27px,var(--paper-line) 28px),linear-gradient(90deg,transparent 68px,rgba(168,47,38,.22) 69px,rgba(168,47,38,.22) 70px,transparent 71px),var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid rgba(168,47,38,.4);outline-offset:2px}
sub,sup{line-height:0;font-size:.72em}
.nuc{display:inline-block;white-space:nowrap}
.nuc sub{margin-right:1px}
.hdr{position:relative;isolation:isolate;overflow:hidden;color:#fff;margin:16px 16px 0;padding:18px 16px 20px;border-radius:16px;background:linear-gradient(180deg,var(--ink) 0%,#1c3040 100%);box-shadow:var(--shadow-lg);font-family:var(--mono)}
.hdr::before{content:'';position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(-45deg,rgba(217,164,65,.16) 0 10px,transparent 10px 20px);opacity:.5}
.hdr::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--red) 0%,var(--amber) 50%,var(--red) 100%)}
.hdr-in{max-width:748px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.hdr .ttl{flex:1;min-width:0}
.hdr h1{margin:0;font-family:var(--mono);font-size:clamp(15px,4.4vw,22px);font-weight:700;line-height:1.3;letter-spacing:-.3px;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.hdr .sub1{margin:5px 0 0;font-family:var(--serif);font-size:13px;color:rgba(233,237,231,.75);font-weight:400}
.hbtn{background:linear-gradient(180deg,#e2a23a 0%,#b9791c 100%);color:#2a1c05;border:1.5px solid rgba(255,255,255,.7);border-radius:10px;padding:8px 13px;font-family:var(--mono);font-weight:700;font-size:13px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.page{max-width:780px;margin-inline:auto;padding:18px 16px 120px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:5px;margin-bottom:12px;background:rgba(24,43,58,.06);border-radius:12px;scrollbar-width:none}
.tab{flex:none;background:transparent;border-radius:8px;padding:9px 14px;font-family:var(--mono);font-weight:700;font-size:12.5px;color:var(--ink-soft)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:var(--shadow-md)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 10px;border-bottom:1px dashed rgba(24,43,58,.2)}
.cnt{font-family:var(--mono);font-weight:700;font-size:16px}
.cnt small{display:block;font-size:11px;font-weight:400;color:var(--ink-soft)}
.btn{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--paper);border:1.5px solid var(--ink);background:var(--ink);border-radius:8px;padding:10px 16px;box-shadow:var(--shadow-sm)}
.btn.blue{background:var(--ink);border-color:var(--ink)}
.btn.red{background:linear-gradient(180deg,var(--red),var(--red-deep));border-color:var(--red-deep);color:#fff}
.btn.orange{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn.grey{background:transparent;color:var(--ink-soft);border-color:rgba(24,43,58,.3);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.row .grow{flex:1 1 220px}
.banner{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-family:var(--mono);font-size:13px;font-weight:700;box-shadow:var(--shadow-sm)}
.banner.score{border-left-color:var(--green)}
.banner.info{background:rgba(217,164,65,.15);border-color:rgba(217,164,65,.5);color:#6b4d0a}
.topic{display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);margin:26px 0 12px;padding-bottom:6px;border-bottom:1px dashed rgba(24,43,58,.3)}
.card{position:relative;background:var(--card);border:1px solid rgba(24,43,58,.12);border-radius:12px;padding:16px 16px 16px 54px;margin-bottom:14px;min-width:0;box-shadow:var(--shadow-sm)}
.qrow{display:block}
.qn{position:absolute;left:14px;top:15px;min-width:28px;height:28px;padding:0 5px;border-radius:14px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;box-shadow:var(--shadow-sm)}
.qtxt{min-width:0;overflow-wrap:anywhere;font-size:15.5px;line-height:1.6}
.sub{display:flex;gap:10px;margin-top:8px}
.sub>span:first-child{color:var(--ink-soft);flex:none;font-family:var(--mono);font-size:12.5px;padding-top:2px}
.alt{margin-top:8px;color:var(--ink-soft);font-size:14.5px}
.tags{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle;margin-left:4px}
.tag{font-family:var(--mono);font-weight:700;font-size:10.5px;border-radius:9px;padding:2px 8px;white-space:nowrap;letter-spacing:.3px;line-height:1.5}
.tag.y24{background:rgba(255,183,3,.22);color:#8a5a00}
.tag.y25{background:rgba(45,138,86,.14);color:#256B48}
.tag.y26{background:rgba(58,110,165,.12);color:#3a6ea5}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tf,.opt{background:#fff;border:1.5px solid rgba(24,43,58,.2);border-radius:8px;padding:10px;font-family:var(--mono);font-weight:700;font-size:14px;text-align:center;color:var(--ink)}
.tf[aria-pressed="true"],.opt[aria-pressed="true"]{border-color:var(--ink);background:rgba(24,43,58,.08)}
.tf.right,.opt.right{border-color:var(--green);background:var(--ok-bg);color:var(--green)}
.tf.wrong,.opt.wrong{border-color:var(--red);background:var(--no-bg);color:var(--red-deep)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;font-family:var(--serif);font-size:15px;font-weight:500;padding:10px 14px}
.opt .l{font-family:var(--mono);font-weight:700;color:var(--red)}
.ans{background:var(--ans-bg);border-left:3px solid var(--ans-bar);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:12px;min-width:0;overflow-wrap:anywhere}
.ans.big{font-weight:700;font-size:15.5px}
.ans.none{color:var(--ink-soft);font-family:var(--mono);font-weight:700;font-size:12.5px;background:rgba(24,43,58,.05);border-left-color:rgba(24,43,58,.3)}
.ans .lab{font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px;opacity:.75;color:var(--green)}
.ls{font-family:var(--mono);font-size:12px;line-height:1.35;background:#fff;border:1px solid rgba(24,43,58,.14);border-radius:8px;padding:8px 10px;margin:8px 0;overflow-x:auto;white-space:pre}
.tb{border-collapse:collapse;font-size:14px;width:100%;margin:8px 0}.tb td{border:1px solid rgba(24,43,58,.18);padding:5px 8px;vertical-align:top;background:rgba(255,255,255,.6)}
.refl{color:var(--ink-soft);font-size:13px}
.ans p{margin:6px 0}
.ans ul{margin:6px 0;padding-left:22px}
.showbtn{display:block;width:100%;margin-top:12px;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--paper);background:var(--ink);border:1.5px solid var(--ink);border-radius:8px;padding:10px;box-shadow:var(--shadow-sm)}
.showbtn.hide{background:transparent;color:var(--ink-soft);border-color:rgba(24,43,58,.3);box-shadow:none}
.sc{overflow-x:auto;max-width:100%}
.rxn{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:8px 0;font-size:16px}
.rxn .cap{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.cfg{font-family:var(--serif);font-size:14.5px;line-height:1.9}
.br{font-size:30px;font-weight:400;line-height:1}
.lw{display:inline-grid;grid-template-areas:". t ." "l s r" ". b .";grid-template-columns:9px auto 9px;align-items:center;justify-items:center;margin-inline:2px;vertical-align:middle;font-weight:700;font-family:var(--serif)}
.lw .sy{grid-area:s;padding:0 1px}
.ds{display:flex;gap:3px}
.ds.v{flex-direction:column}
.ds u{width:5px;height:5px;border-radius:50%;background:var(--ink);display:block}
.ds.t{grid-area:t}.ds.b{grid-area:b}.ds.l{grid-area:l}.ds.r{grid-area:r}
/* chapter list */
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:10px;padding:13px 14px;margin-bottom:10px;font-family:var(--serif);color:var(--ink);background:var(--card);border:1px solid rgba(24,43,58,.10);border-left:3px solid transparent;box-shadow:var(--shadow-sm)}
.chap .k{font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.3px;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,var(--red),var(--red-deep));border-radius:5px;padding:3px 7px;flex:none;white-space:nowrap}
.chap .t{font-weight:600;font-size:15px;line-height:1.3}
.chap.on:hover{border-left-color:var(--red);box-shadow:var(--shadow-md)}
.chap.on{background:linear-gradient(180deg,var(--red) 0%,var(--red-deep) 100%);color:#fff;border-left-color:var(--red-deep)}
.chap.on .k{background:rgba(255,255,255,.25)}
.chap .soon{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);flex:none}
.chap.off{opacity:.55;cursor:default;box-shadow:none}
.chap.off .k{background:var(--ink-soft)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:9}
.fab button{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--ink);border:1px solid rgba(24,43,58,.12);font-size:15px;font-weight:700;box-shadow:0 2px 10px rgba(24,43,58,.18)}

var state={view:'home',sec:'tf',pick:{},shown:{},checked:{}};
var $app=document.getElementById('app');
function secById(id){for(var i=0;i<SECS.length;i++)if(SECS[i].id===id)return SECS[i];}
function count(s){var c=0;s.data.forEach(function(g){c+=g[1].length;});return c;}
function ids(s){var a=[];s.data.forEach(function(g){g[1].forEach(function(it){a.push(s.id+'-'+it[0]);});});return a;}
function findItem(s,id){var n=+id.split('-')[1],r=null;s.data.forEach(function(g){g[1].forEach(function(it){if(it[0]===n)r=it;});});return r;}
var LET=['A','B','C','D'];
function tagsHTML(id){
  var t=TAGS[id];if(!t||!t.length)return '';
  return '<span class="tags">'+t.map(function(x){var y=x.slice(0,4);return '<span class="tag y'+y.slice(2)+'">'+x+'</span>';}).join('')+'</span>';
}
function btnShow(id,shown){return '<button class="showbtn'+(shown?' hide':'')+'" data-act="show" data-id="'+id+'">'+(shown?'🙈 Hide Answer':'👁 Show Answer')+'</button>';}
function itemHTML(s,it){
  var id=s.id+'-'+it[0],shown=!!state.shown[id],p=state.pick[id],chk=!!state.checked[s.id],h='';
  var head='<div class="qrow"><span class="qn">'+it[0]+'</span><div class="qtxt">'+fmt(it[1])+tagsHTML(id)+'</div></div>';
  if(s.kind==='tf'){
    h=head+'<div class="tfrow">';
    ['T','F'].forEach(function(v){
      var c='tf';
      if((shown||chk)&&p===v&&v!==it[2])c+=' wrong';
      if((shown||(chk&&p))&&v===it[2])c+=' right';
      h+='<button class="'+c+'" data-act="pick" data-id="'+id+'" data-v="'+v+'" aria-pressed="'+(p===v)+'">'+(v==='T'?'TRUE':'FALSE')+'</button>';
    });
    h+='</div>';
    if(shown)h+='<div class="ans big">Answer: '+(it[2]==='T'?'TRUE':'FALSE')+'</div>';
  }else if(s.kind==='fb'){
    h=head;
    if(shown)h+='<div class="ans big">Answer: '+fmt(it[2])+'</div>';
  }else if(s.kind==='mc'){
    h=head+'<div class="opts">';
    it[2].forEach(function(o,i){
      var L=LET[i],c='opt';
      if((shown||chk)&&p===L&&L!==it[3])c+=' wrong';
      if((shown||(chk&&p))&&L===it[3])c+=' right';
      h+='<button class="'+c+'" data-act="pick" data-id="'+id+'" data-v="'+L+'" aria-pressed="'+(p===L)+'"><span class="l">'+L+'.</span><span>'+fmt(o)+'</span></button>';
    });
    h+='</div>';
    if(shown)h+='<div class="ans big">Answer: '+it[3]+'. '+fmt(it[2][LET.indexOf(it[3])])+'</div>';
  }else{
    h=head;
    if(shown)h+=it[2]?'<div class="ans"><span class="lab">Answer</span>'+fmt(it[2])+'</div>':'<div class="ans none">Answer not added yet.</div>';
  }
  h+=btnShow(id,shown);
  return '<div class="card" id="it-'+id+'">'+h+'</div>';
}
function scoreHTML(s){
  if(!state.checked[s.id]||(s.kind!=='tf'&&s.kind!=='mc'))return '';
  var ok=0,done=0,tot=0;
  s.data.forEach(function(g){g[1].forEach(function(it){tot++;var p=state.pick[s.id+'-'+it[0]];if(p){done++;if(p===(s.kind==='tf'?it[2]:it[3]))ok++;}});});
  return '<div class="banner score">Score: '+ok+' / '+tot+' correct · '+(tot-done)+' not answered</div>';
}
function listHTML(s){
  var h=scoreHTML(s);
  if(s.note)h+='<div class="banner info">'+s.note+'</div>';
  s.data.forEach(function(g){
    if(g[0])h+='<div class="topic">'+fmt(g[0])+'</div>';
    g[1].forEach(function(it){h+=itemHTML(s,it);});
  });
  return h;
}
function home(){
  var h='<div class="hdr"><div class="hdr-in"><div class="ttl"><h1>Grade 12 Chemistry</h1><p class="sub1">MCK Education Center · Old exam questions</p></div></div></div><div class="page">';
  CHAPTERS.forEach(function(c){
    h+=c[3]?'<button class="chap on" data-act="open"><span class="k">Chapter '+c[0]+'</span><div class="t">'+c[2]+'</div></button>'
            :'<div class="chap off"><span class="k">Chapter '+c[0]+'</span><div class="t">'+c[2]+'</div><span class="soon">coming soon</span></div>';
  });
  h+='</div>';
  $app.innerHTML=h;
}
function chapter(){
  var s=secById(state.sec);
  var h='<div class="hdr"><div class="hdr-in"><button class="hbtn" data-act="home">← Back</button><div class="ttl"><h1>Chapter 1 — Chemical Bonding and Intermolecular Forces</h1><p class="sub1">Grade 12 Chemistry</p></div></div></div><div class="page"><div class="tabs" role="group" aria-label="Sections">';
  SECS.forEach(function(x){h+='<button class="tab" data-act="sec" data-id="'+x.id+'" aria-pressed="'+(x.id===state.sec)+'">'+x.label+'</button>';});
  h+='</div><div class="bar"><div class="cnt">'+count(s)+' questions<small>'+s.marks+'</small></div>'+((s.kind==='tf'||s.kind==='mc')?'<button class="btn orange" data-act="check">Check Answers</button>':'')+'</div>';
  h+='<div class="row"><button class="btn blue grow" data-act="all">👁 Show All Answers</button><button class="btn grey" data-act="reset">Reset</button></div>';
  h+='<div id="secbody">'+listHTML(s)+'</div></div><div class="fab"><button data-act="up" aria-label="Go to top">▲</button><button data-act="down" aria-label="Go to bottom">▼</button></div>';
  $app.innerHTML=h;
}
function render(){state.view==='home'?home():chapter();}
function refreshList(){document.getElementById('secbody').innerHTML=listHTML(secById(state.sec));}
function hop(dir){
  var max=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);
  window.scrollTo({top:dir>0?Math.max(0,max-window.innerHeight):0,behavior:'smooth'});
}
$app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id'),s=secById(state.sec);
  if(act==='open'){state.view='ch';render();window.scrollTo(0,0);}
  else if(act==='home'){state.view='home';render();window.scrollTo(0,0);}
  else if(act==='sec'){state.sec=id;chapter();window.scrollTo(0,0);}
  else if(act==='all'){ids(s).forEach(function(i){state.shown[i]=true;});refreshList();}
  else if(act==='reset'){ids(s).forEach(function(i){delete state.shown[i];delete state.pick[i];});delete state.checked[s.id];refreshList();}
  else if(act==='check'){state.checked[s.id]=true;refreshList();}
  else if(act==='up'){hop(-1);}
  else if(act==='down'){hop(1);}
  else if(act==='pick'||act==='show'){
    var sid=id.split('-')[0],s2=secById(sid),it=findItem(s2,id);
    if(act==='pick')state.pick[id]=(state.pick[id]===b.getAttribute('data-v'))?undefined:b.getAttribute('data-v');
    else state.shown[id]=!state.shown[id];
    document.getElementById('it-'+id).outerHTML=itemHTML(s2,it);
  }
});
render();
